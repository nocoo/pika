name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/bun-quality.yml@v2026.1
    with:
      pre-command: "bun run build"
      test-command: "bun run test:coverage"
      typecheck-command: "bun run lint:typecheck"
      lint-command: "bun run lint:biome"
      enable-l2: "false"
    secrets: inherit

  # ─────────────────────────────────────────────────────
  # CD — Deploy single-worker (web SPA + /api/* Hono) to Cloudflare.
  #
  # Runs only on push-to-main, gated by `quality`. `bun run build`
  # produces packages/web/dist AND mirrors into packages/web-worker/dist
  # (vite outDir per docs/17). `wrangler deploy` then ships the merged
  # worker on the prod custom domains pika.hexly.ai +
  # pika-ingest.worker.hexly.ai.
  # ─────────────────────────────────────────────────────
  deploy:
    name: Deploy Worker (production)
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-pika-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SPA into packages/web-worker/dist
        run: bun run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d51a8fde361e4be31db17d8c56737c1f
          workingDirectory: packages/web-worker
          # `--env=""` targets the top-level config (production) explicitly.
          # Without it, scoped tokens without Memberships:Read fail when
          # wrangler tries to auto-select an account via /memberships.
          command: deploy --env=""

      - name: Verify /api/live
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" https://pika.hexly.ai/api/live || true)
            echo "attempt $i: status=$STATUS"
            # 401 means CF Access intercepted before reaching the worker —
            # that itself proves the deploy is live behind the gate.
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "✅ Worker reachable (status $STATUS)"
              exit 0
            fi
            sleep 5
          done
          echo "❌ /api/live did not respond after 30s"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Pika Deploy"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Worker: deployed to \`pika\` (production)"
            echo "- Verify: https://pika.hexly.ai/api/live"
          } >> "$GITHUB_STEP_SUMMARY"
